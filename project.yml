name: OneIP
options:
  bundleIdPrefix: com.oneip
  xcodeVersion: "16.0"
targets:
  OneIP:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneip.app
        PRODUCT_NAME: OneIP
        INFOPLIST_FILE: Sources/Resources/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone & iPad
    frameworks:
      - framework: MapKit.framework
      - framework: Network.framework
      - framework: SwiftUI.framework
      - framework: CoreLocation.framework
